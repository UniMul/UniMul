<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UniMul - Hologram Bloom Glitch Header JP</title>
  <desc id="desc">Combined hologram, bloom, and glitch style GitHub profile header for UniMul in Japanese.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B18"/>
      <stop offset="1" stop-color="#091426"/>
    </linearGradient>

    <linearGradient id="holo" x1="180" y1="60" x2="980" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BEEFF"/>
      <stop offset="0.32" stop-color="#87A8FF"/>
      <stop offset="0.65" stop-color="#C77DFF"/>
      <stop offset="1" stop-color="#73FFD1"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E213D" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#12294F" stop-opacity="0.28"/>
    </linearGradient>

    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g opacity="0.16">
    <path d="M82 44H1118" stroke="#83D8FF"/>
    <path d="M82 84H1118" stroke="#83D8FF"/>
    <path d="M82 124H1118" stroke="#83D8FF"/>
    <path d="M82 164H1118" stroke="#83D8FF"/>
    <path d="M82 204H1118" stroke="#83D8FF"/>
    <path d="M82 244H1118" stroke="#83D8FF"/>
    <path d="M82 284H1118" stroke="#83D8FF"/>
  </g>

  <rect x="70" y="42" width="1060" height="236" rx="22" fill="url(#panel)" stroke="#70E7FF" stroke-opacity="0.55"/>
  <rect x="86" y="58" width="1028" height="204" rx="18" stroke="#B191FF" stroke-opacity="0.35"/>

  <g opacity="0.18">
    <rect x="820" y="78" width="220" height="6" fill="#73FFD1"/>
    <rect x="860" y="106" width="140" height="5" fill="#6BEEFF"/>
    <rect x="792" y="232" width="210" height="5" fill="#C77DFF"/>
  </g>

  <text x="110" y="128" fill="#FF5D8F" font-family="Inter,Segoe UI,Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="62" font-weight="800" letter-spacing="1.3" opacity="0.70">UniMul</text>
  <text x="108" y="126" fill="url(#holo)" font-family="Inter,Segoe UI,Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="62" font-weight="800" letter-spacing="1.3" filter="url(#bloom)">UniMul</text>

  <text x="110" y="174" fill="#E8F3FF" font-family="Inter,Segoe UI,Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" font-weight="700">Unityエンジニア / グラフィックス / マネジメント / 開発基盤 / AI駆動</text>
  <text x="110" y="214" fill="#9BB4D8" font-family="Inter,Segoe UI,Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="17">Unity・C#・Shader・URP・RenderGraph・クリーンアーキテクチャ・自動化・マネジメント</text>

  <rect x="110" y="240" width="316" height="24" rx="12" fill="#0D1C34" stroke="#73FFD1" stroke-opacity="0.6"/>
  <text x="128" y="256" fill="#D4FFF3" font-family="JetBrains Mono,Consolas,'Hiragino Sans','Yu Gothic',monospace" font-size="13" filter="url(#softBloom)">開発をスケールさせる仕組みを構築</text>
</svg>